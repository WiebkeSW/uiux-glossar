<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UI/UX Glossar — Wiebke Wick</title>
<meta name="description" content="Durchsuchbares UI/UX-Glossar mit live bedienbaren Mini-Beispielen zu jedem Begriff.">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
  <header>
    <div class="title-block">
      <h1>UI/UX Glossar</h1>
      <p class="sub">Begriffe zum Nachschlagen für App- und Dashboard-Arbeit — jeder Begriff mit einem live bedienbaren Mini-Beispiel.</p>
    </div>
    <span class="pill"><span class="dot"></span>Wiebke Wick · wiebke.wick@wsb-service.com</span>
  </header>

  <div class="controls">
    <div class="search-wrap">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="search" type="text" placeholder="Begriff suchen … z. B. „Drawer“, „Toggle“, „Skeleton“" autocomplete="off">
    </div>
    <div class="chips" id="chips"></div>
  </div>

  <div class="count-line" id="count"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none;">Kein Treffer. Versuch einen anderen Begriff.</div>

  <footer>
    <span>Wiebke Wick</span>
    <span>UI/UX Glossar · zum Nachschlagen bei Änderungswünschen</span>
  </footer>
</div>

<script src="app.js" defer></script>
</body>
</html>
